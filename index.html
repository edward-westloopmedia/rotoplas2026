<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Exhibitor floor map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --floor: #e6ebef;
        --hall: #f4f6f8;
        --paper: #ffffff;
        --ink: #15202b;
        --muted: #5b6875;
        --line: #d3dae1;
        --table: #ffffff;
        --table-stroke: #c5cfd8;
        --primary: #1e56d8;
        --primary-soft: #dce6ff;
        --on-primary: #ffffff;
        --pin: #ffb21e;
        --shadow: 0 6px 24px rgba(21, 32, 43, 0.14);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --floor: #0f151b;
          --hall: #151d25;
          --paper: #1b242d;
          --ink: #e7edf2;
          --muted: #93a1ae;
          --line: #2b3743;
          --table: #202b35;
          --table-stroke: #364552;
          --primary: #5b8cff;
          --primary-soft: #23345c;
          --on-primary: #0b1530;
          --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        --floor: #0f151b;
        --hall: #151d25;
        --paper: #1b242d;
        --ink: #e7edf2;
        --muted: #93a1ae;
        --line: #2b3743;
        --table: #202b35;
        --table-stroke: #364552;
        --primary: #5b8cff;
        --primary-soft: #23345c;
        --on-primary: #0b1530;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--floor);
        color: var(--ink);
        font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      #map {
        position: fixed;
        inset: 0;
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      #map.dragging {
        cursor: grabbing;
      }
      #map svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .hall {
        fill: var(--hall);
        stroke: var(--line);
        stroke-width: 2;
      }
      .entrance {
        fill: var(--muted);
        font-size: 13px;
        font-weight: 500;
        text-anchor: middle;
      }
      .door {
        stroke: var(--primary);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .wall {
        stroke: var(--muted);
        stroke-width: 6;
        stroke-linecap: round;
      }
      .theater {
        fill: var(--floor);
        stroke: var(--line);
        stroke-width: 2;
      }
      .theater-label {
        fill: var(--muted);
        font-size: 16px;
        font-weight: 600;
        text-anchor: middle;
      }
      .pillar {
        fill: var(--muted);
      }
      .face rect {
        fill: var(--table);
        transition: fill 0.2s;
      }
      .edge {
        fill: none;
        stroke: var(--table-stroke);
        stroke-width: 1.5;
        stroke-linecap: square;
        transition: stroke 0.2s;
      }
      .code {
        font-size: 12px;
        font-weight: 700;
        fill: var(--ink);
      }
      .nm {
        font-size: 11px;
        fill: var(--muted);
      }
      .avail .face rect {
        fill: var(--hall);
      }
      .avail .edge {
        stroke-dasharray: 5 4;
      }
      .avail .code,
      .avail .nm {
        fill: var(--muted);
        font-weight: 500;
      }
      .tbl {
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .tbl.match .face rect {
        fill: var(--primary-soft);
      }
      .tbl.match .edge,
      .tbl.hover .edge {
        stroke: var(--primary);
        stroke-width: 2.5;
      }
      .tbl.sel .face rect {
        fill: var(--primary);
      }
      .tbl.sel .edge {
        stroke: var(--primary);
        stroke-width: 2.5;
      }
      .tbl.sel text {
        fill: var(--on-primary);
      }
      svg.filtered .tbl:not(.match):not(.sel),
      svg.filtered .avail {
        opacity: 0.4;
      }
      #pin {
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #pin .body {
        fill: var(--pin);
        stroke: #fff;
        stroke-width: 2;
      }
      #pin .ring {
        fill: var(--pin);
        opacity: 0.35;
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 1.6s ease-out infinite;
      }
      @keyframes pulse {
        from {
          transform: scale(0.4);
          opacity: 0.5;
        }
        to {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      .search {
        position: fixed;
        z-index: 20;
        left: 12px;
        right: 12px;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        max-width: 560px;
        margin: 0 auto;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 52px;
        padding: 0 8px 0 16px;
        background: var(--paper);
        border-radius: 26px;
        box-shadow: var(--shadow);
      }
      .field svg {
        flex: none;
        color: var(--muted);
      }
      .field input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        background: none;
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        outline: none;
      }
      .field input::placeholder {
        color: var(--muted);
      }
      .field input::-webkit-search-cancel-button {
        display: none;
      }
      .clear {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .clear[hidden] {
        display: none;
      }
      .suggest {
        margin-top: 8px;
        background: var(--paper);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .suggest[hidden] {
        display: none;
      }
      .suggest button,
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 16px;
        text-align: left;
      }
      .suggest button + button {
        border-top: 1px solid var(--line);
      }
      .suggest button:hover,
      .suggest button.active,
      .row:hover {
        background: var(--floor);
      }
      .suggest .empty {
        padding: 14px 16px;
        color: var(--muted);
        font-size: 14px;
      }
      .badge {
        flex: none;
        min-width: 40px;
        height: 28px;
        padding: 0 8px;
        border-radius: 8px;
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
        font-size: 13px;
        display: grid;
        place-items: center;
      }
      .who {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .who strong {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who span {
        font-size: 13px;
        color: var(--muted);
      }

      .controls {
        position: fixed;
        z-index: 15;
        right: 12px;
        bottom: calc(var(--sheet-h, 40vh) + 12px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: bottom 0.28s ease;
      }
      .controls.nodelay {
        transition: none;
      }
      .controls button {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--paper);
        box-shadow: var(--shadow);
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 500;
      }

      .sheet {
        position: fixed;
        z-index: 18;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 640px;
        margin: 0 auto;
        height: var(--sheet-h, 40vh);
        background: var(--paper);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -4px 24px rgba(21, 32, 43, 0.12);
        display: flex;
        flex-direction: column;
        transition: height 0.28s ease;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .sheet.nodelay {
        transition: none;
      }
      .grab {
        flex: none;
        padding: 10px 0 6px;
        touch-action: none;
        cursor: grab;
      }
      .grab i {
        display: block;
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: var(--line);
        margin: 0 auto;
      }
      .sheet-body {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px 20px 24px;
      }
      .sheet h2 {
        font-size: 24px;
        line-height: 1.2;
        font-weight: 700;
        margin: 12px 0 4px;
        letter-spacing: -0.01em;
      }
      .lead {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .list .row {
        padding: 12px 4px;
        border-bottom: 1px solid var(--line);
      }
      .d-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .d-top .badge {
        height: 32px;
        font-size: 15px;
      }
      .link {
        color: var(--primary);
        font-weight: 600;
        font-size: 14px;
        padding: 8px 0;
      }
      .cat {
        display: none;
        margin: 0 0 16px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--floor);
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 0 0 16px;
      }
      .facts div {
        background: var(--floor);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .facts dt {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .facts dd {
        margin: 0;
        font-weight: 600;
        font-size: 15px;
      }

      .facts div:nth-child(2) {
        display: none;
      }
      .tagline {
        display: none !important;
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.35;
      }
      .desc {
        margin: 0 0 16px;
        line-height: 1.55;
        max-width: 62ch;
      }
      .contact {
        display: flex;
        flex-direction: column;
        margin: 0 0 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .contact a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        color: var(--ink);
        text-decoration: none;
      }
      .contact a + a {
        border-top: 1px solid var(--line);
      }
      .contact svg {
        flex: none;
        color: var(--primary);
      }
      .contact span {
        display: flex;
        flex-direction: column;
        font-weight: 600;
        font-size: 15px;
      }
      .contact small {
        font-weight: 400;
        font-size: 12px;
        color: var(--muted);
      }
      .contact + .note {
        margin-top: -10px;
      }
      .note {
        margin: 0 0 20px;
        font-size: 12px;
        color: var(--muted);
      }
      .note a {
        color: var(--primary);
      }
      .primary {
        width: 100%;
        height: 48px;
        border-radius: 12px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
      }
      .tip {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 30;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 6px;
        background: var(--paper);
        border-radius: 10px;
        box-shadow: var(--shadow);
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .tip[hidden] {
        display: none;
      }

      .listbtn {
        display: none;
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        place-items: center;
        color: var(--muted);
      }
      .listbtn:hover {
        background: var(--floor);
      }
      .listbtn.on {
        background: var(--primary-soft);
        color: var(--primary);
      }

      @media (min-width: 700px) {
        .grab {
          display: none;
        }
        .listbtn {
          display: grid;
        }
        .field {
          padding-left: 8px;
        }
        .field .sicon {
          order: 3;
          margin-right: 8px;
        }
        .sheet {
          left: 12px;
          top: 12px;
          bottom: 12px;
          right: auto;
          width: 360px;
          max-width: none;
          margin: 0;
          height: auto;
          border-radius: 16px;
          box-shadow: var(--shadow);
          padding-top: 72px;
          transition: transform 0.28s ease, visibility 0.28s;
        }
        .panel-closed .sheet {
          transform: translateX(calc(-100% - 12px));
          visibility: hidden;
        }
        .search {
          left: 24px;
          right: auto;
          top: 24px;
          width: 336px;
          max-width: none;
          margin: 0;
        }
        body:not(.panel-closed) .field {
          box-shadow: none;
          background: var(--floor);
        }
        .controls {
          bottom: 24px;
          right: 24px;
        }
      }
      @media (min-width: 1100px) {
        .sheet {
          left: 0;
          top: 0;
          bottom: 0;
          width: 400px;
          border-radius: 0;
          padding-top: 84px;
          box-shadow: 1px 0 0 var(--line), 4px 0 16px rgba(21, 32, 43, 0.08);
        }
        .panel-closed .sheet {
          transform: translateX(-100%);
        }
        .search {
          left: 16px;
          top: 16px;
          width: 368px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #pin .ring {
          animation: none;
        }
        .sheet,
        .controls,
        .tbl rect,
        .tbl {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Exhibition hall floor map"></div>

    <div class="search" role="search">
      <div class="field">
        <button
          class="listbtn"
          id="listbtn"
          aria-label="Show exhibitor list"
          aria-expanded="false"
          aria-controls="sheet"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <svg
          class="sicon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          id="q"
          type="search"
          placeholder="Search exhibitors or booths"
          autocomplete="off"
          aria-label="Search exhibitors"
          aria-controls="suggest"
        />
        <button class="clear" id="clear" aria-label="Clear search" hidden>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="suggest" id="suggest" hidden></div>
    </div>

    <div class="controls" id="controls">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="fit" aria-label="Show whole hall">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
      </button>
    </div>

    <section class="sheet" id="sheet" aria-label="Table details">
      <div
        class="grab"
        id="grab"
        role="button"
        tabindex="0"
        aria-label="Resize panel"
      >
        <i></i>
      </div>
      <div class="sheet-body" id="body"></div>
    </section>

    <div class="tip" id="tip" hidden></div>

      const hall = EXPO.hall;
      const S = 80,
        OX = 60,
        OY = 60;
      const ROWS = hall.grid.length,
        COLS = hall.grid[0].length;
      const colX = (c) => OX + c * S,
        rowY = (r) => OY + r * S;
      const W = OX + COLS * S + 60,
        H = OY + ROWS * S + 110;
      const cellOf = {};
      hall.grid.forEach((row, r) =>
        row.forEach((n, c) => {
          if (n) cellOf[n] = { r, c };
        })
      );

      function makeBooth(id, info, nums) {
        const cells = nums
          .map((n) => cellOf[n])
          .filter(Boolean)
          .sort((a, b) => a.r - b.r || a.c - b.c);
        if (!cells.length)
          return { id, ...info, booths: nums, cells, label: "TBD" };
        const cx =
          cells.reduce((s, p) => s + colX(p.c) + S / 2, 0) / cells.length;
        const cy =
          cells.reduce((s, p) => s + rowY(p.r) + S / 2, 0) / cells.length;
        const top = cells.filter((p) => p.r === cells[0].r);
        const pinX =
            top.reduce((s, p) => s + colX(p.c) + S / 2, 0) / top.length,
          pinY = rowY(cells[0].r) + 2;
        return {
          id,
          ...info,
          booths: nums,
          cells,
          cx,
          cy,
          pinX,
          pinY,
          label: String(Math.min(...nums)),
        };
      }
      const booths = Object.entries(EXPO.exhibitors).map(([id, e]) =>
        makeBooth(
          id,
          e,
          [...e.booths].sort((a, b) => a - b)
        )
      );
      const byId = Object.fromEntries(booths.map((b) => [b.id, b]));
      const takenBy = {};
      for (const b of booths) for (const n of b.booths) takenBy[n] = b.name;
      const unlisted = Object.keys(cellOf)
        .map(Number)
        .filter((n) => !takenBy[n])
        .map((n) => makeBooth("", { name: "" }, [n]));

      const claimed = {};
      for (const b of booths) {
        for (const n of b.booths) {
          if (!cellOf[n])
            console.warn(`${b.name}: booth ${n} is not on the floor plan`);
          if (claimed[n])
            console.warn(
              `Booth ${n} is used by both ${claimed[n]} and ${b.name}`
            );
          claimed[n] = b.name;
        }
        if (!b.cells.length) continue;
        const key = (p) => p.r + "," + p.c,
          all = new Set(b.cells.map(key));
        const seen = new Set([key(b.cells[0])]),
          stack = [b.cells[0]];
        while (stack.length) {
          const p = stack.pop();
          for (const [dr, dc] of [
            [0, 1],
            [1, 0],
            [0, -1],
            [-1, 0],
          ]) {
            const n = { r: p.r + dr, c: p.c + dc };
            if (all.has(key(n)) && !seen.has(key(n))) {
              seen.add(key(n));
              stack.push(n);
            }
          }
        }
        if (seen.size !== all.size)
          console.warn(
            `${b.name}: booths ${b.booths.join(", ")} must share a side`
          );
      }

      function boothShape(b) {
        const own = new Set(b.cells.map((p) => p.r + "," + p.c)),
          has = (r, c) => own.has(r + "," + c);
        let faces = "",
          d = "";
        for (const p of b.cells) {
          const x = colX(p.c),
            y = rowY(p.r);
          faces += `<rect x="${x}" y="${y}" width="${S}" height="${S}"/>`;
          if (!has(p.r - 1, p.c)) d += `M${x} ${y}h${S}`;
          if (!has(p.r + 1, p.c)) d += `M${x} ${y + S}h${S}`;
          if (!has(p.r, p.c - 1)) d += `M${x} ${y}v${S}`;
          if (!has(p.r, p.c + 1)) d += `M${x + S} ${y}v${S}`;
        }
        return `<g class="face">${faces}</g><path class="edge" d="${d}"/>`;
      }
      function boothLabel(b) {
        const a = b.cells[0],
          own = new Set(b.cells.map((p) => p.r + "," + p.c));
        let wc = 1;
        while (own.has(a.r + "," + (a.c + wc))) wc++;
        const tall = own.has(a.r + 1 + "," + a.c);
        const max = Math.floor((wc * S - 16) / 6.2),
          maxLines = tall ? 3 : 2;
        const lines = [];
        for (const word of b.name.split(" ")) {
          const last = lines.length - 1;
          if (last >= 0 && (lines[last] + " " + word).length <= max)
            lines[last] += " " + word;
          else lines.push(word);
        }
        if (lines.length > maxLines) {
          lines.length = maxLines;
          lines[maxLines - 1] += "…";
        }
        const fit = (s) => (s.length > max ? s.slice(0, max - 1) + "…" : s);
        const nums = b.cells
          .map(
            (p) =>
              `<text class="code" x="${colX(p.c) + 8}" y="${rowY(p.r) + 18}">${
                hall.grid[p.r][p.c]
              }</text>`
          )
          .join("");
        return (
          nums +
          lines
            .map(
              (l, i) =>
                `<text class="nm" x="${colX(a.c) + 8}" y="${
                  rowY(a.r) + 36 + i * 13
                }">${fit(l)}</text>`
            )
            .join("")
        );
      }

      const mapEl = document.getElementById("map");
      const th = hall.theater,
        hx = OX - 24,
        hy = OY - 24,
        wallX = colX(COLS);
      let svgStr = `<svg xmlns="http://www.w3.org/2000/svg" id="svg"><g id="world">
              <rect class="hall" x="${hx}" y="${hy}" width="${
        wallX - hx
      }" height="${rowY(ROWS) + 64 - hy}" rx="16"/>
              <line class="wall" x1="${wallX}" y1="${hy}" x2="${wallX}" y2="${
        rowY(ROWS) + 64
      }"/>
              <rect class="theater" x="${hx}" y="${hy}" width="${
        colX(th.col + th.cols) - hx
      }" height="${rowY(th.row + th.rows) - 16 - hy}" rx="16"/>
              <text class="theater-label" x="${
                (hx + colX(th.col + th.cols)) / 2
              }" y="${(hy + rowY(th.row + th.rows) - 16) / 2 + 6}">${
        th.label
      }</text>
              <line class="door" x1="${W / 2 - 60}" y1="${
        rowY(ROWS) + 64
      }" x2="${W / 2 + 60}" y2="${rowY(ROWS) + 64}"/>
              <text class="entrance" x="${W / 2}" y="${
        rowY(ROWS) + 92
      }">Main entrance</text>`;
      for (const [x, y] of hall.pillars)
        svgStr += `<circle class="pillar" cx="${OX + x * S}" cy="${
          OY + y * S
        }" r="8"/>`;
      for (const b of unlisted)
        svgStr += `<g class="avail">${boothShape(b)}${boothLabel(b)}</g>`;
      for (const b of booths)
        if (b.cells.length)
          svgStr += `<g class="tbl" data-id="${b.id}">${boothShape(

          )}${boothLabel(b)}</g>`;
      svgStr += `<g id="pin" opacity="0"><circle class="ring" cx="0" cy="0" r="18"/>
              <path class="body" d="M0 0c-2-9-12-13-12-23a12 12 0 0 1 24 0c0 10-10 14-12 23z"/>
              <circle cx="0" cy="-23" r="4.5" fill="#fff"/></g></g></svg>`;
      mapEl.innerHTML = svgStr;
      const svg = document.getElementById("svg"),
        world = document.getElementById("world"),
        pin = document.getElementById("pin");
      const raise = (el) => world.insertBefore(el, pin);

      const view = { x: 0, y: 0, k: 1 };
      const MIN_K = 0.2,
        MAX_K = 4;
      const clampK = (k) => Math.min(MAX_K, Math.max(MIN_K, k));
      const apply = () =>
        world.setAttribute(
          "transform",
          `translate(${view.x} ${view.y}) scale(${view.k})`
        );
      let anim = null;

      const wide = () => innerWidth >= 700;
      function visibleArea() {
        if (wide()) {
          const left = document.body.classList.contains("panel-closed")
            ? 0
            : innerWidth >= 1100
            ? 400
            : 372;
          return {
            top: 0,
            bottom: innerHeight,
            cx: (left + innerWidth) / 2,
            cy: innerHeight / 2,
            w: innerWidth - left,
            h: innerHeight,
          };
        }
        const top =
          document.querySelector(".search").getBoundingClientRect().bottom + 8;
        const bottom = innerHeight - sheetH;
        return {
          top,
          bottom,
          cx: innerWidth / 2,
          cy: (top + bottom) / 2,
          w: innerWidth,
          h: Math.max(80, bottom - top),
        };
      }
      function animateTo(target) {
        cancelAnimationFrame(anim);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          Object.assign(view, target);
          apply();
          return;
        }
        const from = { ...view },
          t0 = performance.now(),
          dur = 420;
        const step = (now) => {
          const p = Math.min(1, (now - t0) / dur),
            e = 1 - Math.pow(1 - p, 3);
          view.x = from.x + (target.x - from.x) * e;
          view.y = from.y + (target.y - from.y) * e;
          view.k = from.k + (target.k - from.k) * e;
          apply();
          if (p < 1) anim = requestAnimationFrame(step);
        };
        anim = requestAnimationFrame(step);
      }
      function fitHall(animate = true) {
        const a = visibleArea(),
          k = clampK(Math.min(a.w / W, a.h / H) * 0.98);
        const target = { k, x: a.cx - (W / 2) * k, y: a.cy - (H / 2) * k };
        animate ? animateTo(target) : (Object.assign(view, target), apply());
      }
      function flyTo(b) {
        const a = visibleArea(),
          k = clampK(Math.min(1.2, a.w / (4.6 * S)));
        animateTo({ k, x: a.cx - b.cx * k, y: a.cy - b.cy * k });
      }
      function zoomAt(px, py, k) {
        k = clampK(k);
        const wx = (px - view.x) / view.k,
          wy = (py - view.y) / view.k;
        view.k = k;
        view.x = px - wx * k;
        view.y = py - wy * k;
        apply();
      }

      const pointers = new Map();
      let pan = null,
        pinch = null,
        moved = false;
      svg.addEventListener("pointerdown", (e) => {
        cancelAnimationFrame(anim);
        svg.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          moved = false;
          startPan(e.clientX, e.clientY);
        }
        if (pointers.size === 2) startPinch();
        mapEl.classList.add("dragging");
      });
      function startPan(x, y) {
        pan = { sx: x, sy: y, x: view.x, y: view.y };
        pinch = null;
      }
      function startPinch() {
        const [a, b] = [...pointers.values()];
        pinch = {
          d: Math.hypot(a.x - b.x, a.y - b.y),
          mx: (a.x + b.x) / 2,
          my: (a.y + b.y) / 2,
          ...view,
        };
        moved = true;
        pan = null;
      }
      svg.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && pointers.size >= 2) {
          const [a, b] = [...pointers.values()];
          const k = clampK(
            (pinch.k * Math.hypot(a.x - b.x, a.y - b.y)) / pinch.d
          );
          const mx = (a.x + b.x) / 2,
            my = (a.y + b.y) / 2;
          const wx = (pinch.mx - pinch.x) / pinch.k,
            wy = (pinch.my - pinch.y) / pinch.k;
          view.k = k;
          view.x = mx - wx * k;
          view.y = my - wy * k;
          apply();
        } else if (pan) {
          const dx = e.clientX - pan.sx,
            dy = e.clientY - pan.sy;
          if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
          view.x = pan.x + dx;
          view.y = pan.y + dy;
          apply();
        }
      });
      function endPointer(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (pointers.size === 1) {
          const p = [...pointers.values()][0];
          startPan(p.x, p.y);
        }
        if (pointers.size === 0) {
          mapEl.classList.remove("dragging");
          if (!moved && e.type === "pointerup") {
            const hit = document
              .elementFromPoint(e.clientX, e.clientY)
              ?.closest(".tbl");
            if (hit && hit.dataset.id === selected) {
              clearSelection();
              setSheet(snaps()[0]);
              fitHall();
            } else if (hit) select(hit.dataset.id);
          }
          pan = pinch = null;
        }
      }
      svg.addEventListener("pointerup", endPointer);
      svg.addEventListener("pointercancel", endPointer);
      svg.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          cancelAnimationFrame(anim);
          zoomAt(e.clientX, e.clientY, view.k * Math.exp(-e.deltaY * 0.0015));
        },
        { passive: false }
      );

      const zoomBtn = (f) => {
        const a = visibleArea();
        animateTo(
          (() => {
            const k = clampK(view.k * f),
              wx = (a.cx - view.x) / view.k,
              wy = (a.cy - view.y) / view.k;
            return { k, x: a.cx - wx * k, y: a.cy - wy * k };
          })()
        );
      };
      document.getElementById("zin").onclick = () => zoomBtn(1.5);
      document.getElementById("zout").onclick = () => zoomBtn(1 / 1.5);
      document.getElementById("fit").onclick = () => fitHall();

      const sheet = document.getElementById("sheet"),
        controls = document.getElementById("controls"),
        grab = document.getElementById("grab");
      let sheetH = 0;
      const snaps = () => [
        32,
        Math.round(innerHeight * 0.45),
        Math.round(innerHeight * 0.86),
      ];
      function setSheet(h, animate = true) {
        sheetH = h;
        sheet.classList.toggle("nodelay", !animate);
        controls.classList.toggle("nodelay", !animate);
        document.documentElement.style.setProperty("--sheet-h", h + "px");
      }
      let drag = null;
      grab.addEventListener("pointerdown", (e) => {
        grab.setPointerCapture(e.pointerId);
        drag = { y: e.clientY, h: sheetH, moved: false };
      });
      grab.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const dy = e.clientY - drag.y;
        if (Math.abs(dy) > 4) drag.moved = true;
        const s = snaps();
        setSheet(Math.min(s[2], Math.max(s[0], drag.h - dy)), false);
      });
      grab.addEventListener("pointerup", () => {
        if (!drag) return;
        const s = snaps();
        if (!drag.moved) {
          const i = s.indexOf(drag.h);
          setSheet(s[(i + 1) % s.length]);
        } else
          setSheet(
            s.reduce((a, b) =>
              Math.abs(b - sheetH) < Math.abs(a - sheetH) ? b : a
            )
          );
        drag = null;
      });
      grab.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        const s = snaps(),
          i = s.indexOf(sheetH);
        setSheet(s[(i + 1) % s.length]);
      });

      const listBtn = document.getElementById("listbtn");
      function setPanel(open) {
        sheet.classList.remove("nodelay");
        document.body.classList.toggle("panel-closed", !open);
        listBtn.classList.toggle("on", open);
        listBtn.setAttribute("aria-expanded", open);
        listBtn.setAttribute(
          "aria-label",
          open ? "Hide exhibitor list" : "Show exhibitor list"
        );
      }
      listBtn.onclick = () =>
        setPanel(document.body.classList.contains("panel-closed"));

      const tip = document.getElementById("tip"),
        canHover = matchMedia("(hover: hover) and (pointer: fine)");
      let hovered = null;
      function setHover(el, e) {
        if (hovered !== el) {
          hovered?.classList.remove("hover");
          hovered = el;
          if (el) {
            el.classList.add("hover");
            raise(el);
          }
          const sel = svg.querySelector(".tbl.sel");
          if (sel && sel !== el) raise(sel);
        }
        if (!el) {
          tip.hidden = true;
          return;
        }
        const b = byId[el.dataset.id];
        tip.innerHTML = `<span class="badge">${b.label}</span>${b.name}`;
        tip.hidden = false;
        const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8),
          y = Math.min(e.clientY + 18, innerHeight - tip.offsetHeight - 8);
        tip.style.transform = `translate(${x}px, ${y}px)`;
      }
      svg.addEventListener("pointermove", (e) => {
        if (!canHover.matches || e.pointerType !== "mouse") return;
        setHover(pointers.size ? null : e.target.closest(".tbl"), e);
      });
      svg.addEventListener("pointerleave", () => setHover(null));

      addEventListener("keydown", (e) => {
        if (document.activeElement === q) return;
        if (e.key === "/") {
          e.preventDefault();
          q.focus();
        } else if (e.key === "Escape" && selected) clearSelection();
      });

      const body = document.getElementById("body");
      let selected = null;
      function select(id) {
        const t = byId[id];
        if (!t) return;
        selected = id;
        setHover(null);
        svg
          .querySelectorAll(".tbl.sel")
          .forEach((el) => el.classList.remove("sel"));
        const el = svg.querySelector(`.tbl[data-id="${id}"]`);
        if (el) {
          el.classList.add("sel");
          raise(el);
          pin.setAttribute("transform", `translate(${t.pinX} ${t.pinY})`);
        }
        pin.setAttribute("opacity", el ? "1" : "0");
        q.value = "";
        search("");
        renderDetail(t);
        if (wide()) setPanel(true);
        else if (sheetH <= snaps()[0]) setSheet(snaps()[1]);
        if (el) flyTo(t);
      }
      function clearSelection() {
        selected = null;
        setHover(null);
        svg
          .querySelectorAll(".tbl.sel")
          .forEach((el) => el.classList.remove("sel"));
        pin.setAttribute("opacity", "0");
        renderList();
      }
      function renderDetail(t) {
        body.innerHTML = `<div class="detail">
                <div class="d-top"><span class="badge">${
                  t.label
                }</span><button class="link" id="back">All exhibitors</button></div>
                <h2>${t.name}</h2>
                <p class="tagline">${t.tagline}</p>
                <span class="cat">${t.category}</span>
                <dl class="facts">
                  <div><dt>${
                    t.booths.length > 1 ? "Booths" : "Booth"
                  }</dt><dd>${
          t.booths.length ? t.booths.join(", ") : "To be announced"
        }</dd></div>
                  <div><dt>Open</dt><dd>${t.hours}</dd></div>
                </dl>
                <p class="desc">${t.description}</p>
                <div class="contact">
                  <a href="${t.website}" target="_blank" rel="noopener">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
                    <span><small>Website</small>${t.website
                      .replace(/^https?:\/\/(www\.)?/, "")
                      .replace(/\/$/, "")}</span></a>
                  <a href="tel:${t.contact.replace(/[^\d+]/g, "")}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
                    <span><small>Contact</small>${t.contact}</span></a>
                </div>
                <p class="note">Phone number and hours are sample data.</p>
                ${
                  t.cells.length
                    ? `<button class="primary" id="center">Center on map</button>`
                    : ""
                }</div>`;
        body.scrollTop = 0;
        document.getElementById("back").onclick = clearSelection;
        if (t.cells.length)
          document.getElementById("center").onclick = () => flyTo(t);
      }
      function renderList() {
        const sorted = [...booths].sort((a, b) => a.name.localeCompare(b.name));
        body.innerHTML = `<h2>${hall.name}</h2><p class="lead">${
          booths.length
        } exhibitors. Search or tap a booth to see details.</p>
                <p class="note">Unofficial mockup. Exhibitor details from <a href="https://rotoplas.org/exhibitors/" target="_blank" rel="noopener">rotoplas.org</a>.</p>
                <div class="list">${sorted
                  .map(
                    (
                      t
                    ) => `<button class="row" data-id="${t.id}"><span class="badge">${t.label}</span>
                  <span class="who"><strong>${t.name}</strong><span>${t.category}</span></span></button>`
                  )
                  .join("")}</div>`;
        body
          .querySelectorAll(".row")
          .forEach((b) => (b.onclick = () => select(b.dataset.id)));
      }

      const q = document.getElementById("q"),
        suggest = document.getElementById("suggest"),
        clearBtn = document.getElementById("clear");
      let results = [],
        active = 0;
      const esc = (s) =>
        s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      function search(text) {
        const s = text.trim().toLowerCase();
        clearBtn.hidden = !text;
        svg
          .querySelectorAll(".tbl.match")
          .forEach((el) => el.classList.remove("match"));
        if (!s) {
          svg.classList.remove("filtered");
          closeSuggest();
          return;
        }
        results = booths.filter(
          (t) =>
            t.name.toLowerCase().includes(s) ||
            t.booths.some((n) => String(n).startsWith(s))
        );
        results.forEach((t) => {
          const el = svg.querySelector(`.tbl[data-id="${t.id}"]`);
          if (el) {
            el.classList.add("match");
            raise(el);
          }
        });
        svg.classList.add("filtered");
        active = 0;
        suggest.hidden = false;
        suggest.innerHTML = results.length
          ? results
              .slice(0, 6)
              .map(
                (t, i) => `<button data-id="${t.id}" class="${
                  i === 0 ? "active" : ""
                }"><span class="badge">${t.label}</span>
                    <span class="who"><strong>${t.name}</strong><span>${
                  t.category
                }</span></span></button>`
              )
              .join("")
          : `<div class="empty">No exhibitor matches “${esc(
              text.trim()
            )}”. Try a company name or a booth number like 151.</div>`;
        suggest
          .querySelectorAll("button")
          .forEach((b) => (b.onclick = () => select(b.dataset.id)));
      }
      function closeSuggest() {
        suggest.hidden = true;
      }
      q.addEventListener("input", () => search(q.value));
      q.addEventListener("focus", () => {
        if (q.value) search(q.value);
      });
      q.addEventListener("keydown", (e) => {
        const btns = [...suggest.querySelectorAll("button")];
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (!btns.length) return;
          e.preventDefault();
          active =
            (active + (e.key === "ArrowDown" ? 1 : btns.length - 1)) %
            btns.length;
          btns.forEach((b, i) => b.classList.toggle("active", i === active));
        } else if (e.key === "Enter" && btns[active]) {
          select(btns[active].dataset.id);
          q.blur();
        } else if (e.key === "Escape") closeSuggest();
      });
      clearBtn.onclick = () => {
        q.value = "";
        search("");
        q.focus();
      };

      setSheet(snaps()[0], false);
      setPanel(false);
      renderList();
      fitHall(false);
      let wasWide = wide();
      addEventListener("resize", () => {
        const s = snaps();
        setSheet(
          s.reduce((a, b) =>
            Math.abs(b - sheetH) < Math.abs(a - sheetH) ? b : a
          ),
          false
        );
        if (wide() !== wasWide) {
          wasWide = wide();
          selected ? flyTo(byId[selected]) : fitHall(false);
        }
      });
    </script>
  </body>
</html>
