<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --floor:#E6EBEF; --hall:#F4F6F8; --paper:#FFFFFF; --ink:#15202B; --muted:#5B6875;

  --primary-soft:#DCE6FF; --on-primary:#FFFFFF; --pin:#FFB21E; --shadow:0 6px 24px rgba(21,32,43,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --floor:#0F151B; --hall:#151D25; --paper:#1B242D; --ink:#E7EDF2; --muted:#93A1AE;
    --line:#2B3743; --table:#202B35; --table-stroke:#364552; --primary:#5B8CFF;
    --primary-soft:#23345C; --on-primary:#0B1530; --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --floor:#0F151B; --hall:#151D25; --paper:#1B242D; --ink:#E7EDF2; --muted:#93A1AE;
  --line:#2B3743; --table:#202B35; --table-stroke:#364552; --primary:#5B8CFF;
  --primary-soft:#23345C; --on-primary:#0B1530; --shadow:0 6px 24px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--floor);color:var(--ink);
  font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Map */
#map{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#map svg{width:100%;height:100%;display:block}
.hall{fill:var(--hall);stroke:var(--line);stroke-width:2}
.entrance{fill:var(--muted);font-size:13px;font-weight:500;text-anchor:middle}
.door{stroke:var(--primary);stroke-width:4;stroke-linecap:round}
.wall{stroke:var(--muted);stroke-width:6;stroke-linecap:round}
.theater{fill:var(--floor);stroke:var(--line);stroke-width:2}
.theater-label{fill:var(--muted);font-size:16px;font-weight:600;text-anchor:middle}
.pillar{fill:var(--muted)}
.face rect{fill:var(--table);transition:fill .2s}
.edge{fill:none;stroke:var(--table-stroke);stroke-width:1.5;stroke-linecap:square;transition:stroke .2s}
.code{font-size:12px;font-weight:700;fill:var(--ink)}
.nm{font-size:11px;fill:var(--muted)}
.avail .face rect{fill:var(--hall)}
.avail .edge{stroke-dasharray:5 4}
.avail .code,.avail .nm{fill:var(--muted);font-weight:500}
.tbl{cursor:pointer;transition:opacity .2s}
.tbl.match .face rect{fill:var(--primary-soft)}
.tbl.match .edge,.tbl.hover .edge{stroke:var(--primary);stroke-width:2.5}
.tbl.sel .face rect{fill:var(--primary)}
.tbl.sel .edge{stroke:var(--primary);stroke-width:2.5}
.tbl.sel text{fill:var(--on-primary)}
svg.filtered .tbl:not(.match):not(.sel),svg.filtered .avail{opacity:.4}
#pin{pointer-events:none;transition:opacity .2s}
#pin .body{fill:var(--pin);stroke:#fff;stroke-width:2}
#pin .ring{fill:var(--pin);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:.5}to{transform:scale(1.6);opacity:0}}

/* Search */
.search{position:fixed;z-index:20;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:560px;margin:0 auto}
.field{display:flex;align-items:center;gap:8px;height:52px;padding:0 8px 0 16px;background:var(--paper);border-radius:26px;box-shadow:var(--shadow)}
.field svg{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none}
.field input::placeholder{color:var(--muted)}
.field input::-webkit-search-cancel-button{display:none}
.clear{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.clear[hidden]{display:none}
.suggest{margin-top:8px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.suggest[hidden]{display:none}
.suggest button,.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left}
.suggest button + button{border-top:1px solid var(--line)}
.suggest button:hover,.suggest button.active,.row:hover{background:var(--floor)}
.suggest .empty{padding:14px 16px;color:var(--muted);font-size:14px}
.badge{flex:none;min-width:40px;height:28px;padding:0 8px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px;display:grid;place-items:center}
.who{display:flex;flex-direction:column;min-width:0}
.who strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted)}

/* Map controls */
.controls{position:fixed;z-index:15;right:12px;bottom:calc(var(--sheet-h,40vh) + 12px);display:flex;flex-direction:column;gap:8px;transition:bottom .28s ease}
.controls.nodelay{transition:none}
.controls button{width:44px;height:44px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;font-weight:500}

/* Bottom sheet */
.sheet{position:fixed;z-index:18;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;height:var(--sheet-h,40vh);
  background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(21,32,43,.12);display:flex;flex-direction:column;
  transition:height .28s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.nodelay{transition:none}
.grab{flex:none;padding:10px 0 6px;touch-action:none;cursor:grab}
.grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 24px}
.sheet h2{font-size:24px;line-height:1.2;font-weight:700;margin:12px 0 4px;letter-spacing:-.01em}
.lead{margin:0 0 12px;color:var(--muted);font-size:14px}
.list .row{padding:12px 4px;border-bottom:1px solid var(--line)}
.d-top{display:flex;align-items:center;justify-content:space-between}
.d-top .badge{height:32px;font-size:15px}
.link{color:var(--primary);font-weight:600;font-size:14px;padding:8px 0}
.cat{display:inline-block;margin:0 0 16px;padding:4px 10px;border-radius:999px;background:var(--floor);font-size:13px;font-weight:500;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.facts div{background:var(--floor);border-radius:12px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.facts dd{margin:0;font-weight:600;font-size:15px}
.tagline{margin:0 0 12px;font-size:17px;font-weight:500;line-height:1.35}
.desc{margin:0 0 16px;line-height:1.55;max-width:62ch}
.contact{display:flex;flex-direction:column;margin:0 0 20px;border:1px solid var(--line);border-radius:12px}
.contact a{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
.contact a + a{border-top:1px solid var(--line)}
.contact svg{flex:none;color:var(--primary)}
.contact span{display:flex;flex-direction:column;font-weight:600;font-size:15px}
.contact small{font-weight:400;font-size:12px;color:var(--muted)}
.primary{width:100%;height:48px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:600}
/* Hover tooltip (mouse only) */
.tip{position:fixed;left:0;top:0;z-index:30;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;
  background:var(--paper);border-radius:10px;box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap}
.tip[hidden]{display:none}

/* List button in the search bar (tablet and laptop only) */
.listbtn{display:none;flex:none;width:36px;height:36px;border-radius:50%;place-items:center;color:var(--muted)}
.listbtn:hover{background:var(--floor)}
.listbtn.on{background:var(--primary-soft);color:var(--primary)}

/* Tablet: floating card panel on the left */
@media (min-width: 700px){
  .grab{display:none}
  .listbtn{display:grid}
  .field{padding-left:8px}
  .field .sicon{order:3;margin-right:8px}
  .sheet{left:12px;top:12px;bottom:12px;right:auto;width:360px;max-width:none;margin:0;height:auto;border-radius:16px;
    box-shadow:var(--shadow);padding-top:72px;transition:transform .28s ease,visibility .28s}
  .panel-closed .sheet{transform:translateX(calc(-100% - 12px));visibility:hidden}
  .search{left:24px;right:auto;top:24px;width:336px;max-width:none;margin:0}
  body:not(.panel-closed) .field{box-shadow:none;background:var(--floor)}
  .controls{bottom:24px;right:24px}
}
/* Laptop and desktop: full-height panel docked on the left */
@media (min-width: 1100px){
  .sheet{left:0;top:0;bottom:0;width:400px;border-radius:0;padding-top:84px;box-shadow:1px 0 0 var(--line),4px 0 16px rgba(21,32,43,.08)}
  .panel-closed .sheet{transform:translateX(-100%)}
  .search{left:16px;top:16px;width:368px}
}

@media (prefers-reduced-motion: reduce){
  #pin .ring{animation:none}
  .sheet,.controls,.tbl rect,.tbl{transition:none}
}
</style>
</head>

// ---- Floor geometry (everything below is derived from EXPO) ----
const hall = EXPO.hall;
const S = 80, OX = 60, OY = 60;                       // booth size and floor margin, in map units
const ROWS = hall.grid.length, COLS = hall.grid[0].length;
const colX = c => OX + c*S, rowY = r => OY + r*S;
const W = OX + COLS*S + 60, H = OY + ROWS*S + 110;
const cellOf = {};
hall.grid.forEach((row, r) => row.forEach((n, c) => { if (n) cellOf[n] = {r, c}; }));

function makeBooth(id, info, nums) {
  const cells = nums.map(n => cellOf[n]).filter(Boolean).sort((a, b) => a.r - b.r || a.c - b.c);
  const cx = cells.reduce((s, p) => s + colX(p.c) + S/2, 0) / cells.length;
  const cy = cells.reduce((s, p) => s + rowY(p.r) + S/2, 0) / cells.length;
  const top = cells.filter(p => p.r === cells[0].r);   // pin sits on the booth's top edge
  const pinX = top.reduce((s, p) => s + colX(p.c) + S/2, 0) / top.length, pinY = rowY(cells[0].r) + 2;
  return {id, ...info, booths: nums, cells, cx, cy, pinX, pinY, label: String(Math.min(...nums))};
}
const booths = Object.entries(EXPO.exhibitors).map(([id, e]) => makeBooth(id, e, [...e.booths].sort((a, b) => a - b)));
const byId = Object.fromEntries(booths.map(b => [b.id, b]));
const takenBy = {};
for (const b of booths) for (const n of b.booths) takenBy[n] = b.name;
const available = Object.keys(cellOf).map(Number).filter(n => !takenBy[n]).map(n => makeBooth("", {name: "Available"}, [n]));

// Warn about data mistakes: unknown booths, double-booked booths, booths that don't share a side
const claimed = {};
for (const b of booths) {
  for (const n of b.booths) {
    if (!cellOf[n]) console.warn(`${b.name}: booth ${n} is not on the floor plan`);
    if (claimed[n]) console.warn(`Booth ${n} is used by both ${claimed[n]} and ${b.name}`);
    claimed[n] = b.name;
  }
  if (!b.cells.length) continue;
  const key = p => p.r + "," + p.c, all = new Set(b.cells.map(key));
  const seen = new Set([key(b.cells[0])]), stack = [b.cells[0]];
  while (stack.length) {
    const p = stack.pop();
    for (const [dr, dc] of [[0,1],[1,0],[0,-1],[-1,0]]) {
      const n = {r: p.r+dr, c: p.c+dc};
      if (all.has(key(n)) && !seen.has(key(n))) { seen.add(key(n)); stack.push(n); }
    }
  }
  if (seen.size !== all.size) console.warn(`${b.name}: booths ${b.booths.join(", ")} must share a side`);
}

// One exhibitor = one shape: square cells that touch, with an outline only where
// a cell meets a different booth or an aisle (so shared booths have no inner lines)
function boothShape(b) {
  const own = new Set(b.cells.map(p => p.r + "," + p.c)), has = (r, c) => own.has(r + "," + c);
  let faces = "", d = "";
  for (const p of b.cells) {
    const x = colX(p.c), y = rowY(p.r);
    faces += `<rect x="${x}" y="${y}" width="${S}" height="${S}"/>`;
    if (!has(p.r-1, p.c)) d += `M${x} ${y}h${S}`;
    if (!has(p.r+1, p.c)) d += `M${x} ${y+S}h${S}`;
    if (!has(p.r, p.c-1)) d += `M${x} ${y}v${S}`;
    if (!has(p.r, p.c+1)) d += `M${x+S} ${y}v${S}`;
  }
  return `<g class="face">${faces}</g><path class="edge" d="${d}"/>`;
}
// Every cell shows its own booth number; the name appears once, under the top-left number
function boothLabel(b) {
  const a = b.cells[0], own = new Set(b.cells.map(p => p.r + "," + p.c));
  let wc = 1; while (own.has(a.r + "," + (a.c + wc))) wc++;
  const tall = own.has((a.r + 1) + "," + a.c);
  const max = Math.floor((wc*S - 16) / 6.2), maxLines = tall ? 3 : 2;
  const lines = [];
  for (const word of b.name.split(" ")) {
    const last = lines.length - 1;
    if (last >= 0 && (lines[last] + " " + word).length <= max) lines[last] += " " + word;
    else lines.push(word);
  }
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines-1] += "…"; }
  const fit = s => s.length > max ? s.slice(0, max - 1) + "…" : s;
  const nums = b.cells.map(p => `<text class="code" x="${colX(p.c)+8}" y="${rowY(p.r)+18}">${hall.grid[p.r][p.c]}</text>`).join("");
  return nums + lines.map((l, i) => `<text class="nm" x="${colX(a.c)+8}" y="${rowY(a.r)+36+i*13}">${fit(l)}</text>`).join("");
}

const mapEl = document.getElementById("map");
const th = hall.theater, hx = OX - 24, hy = OY - 24, wallX = colX(COLS);
let svgStr = `<svg xmlns="http://www.w3.org/2000/svg" id="svg"><g id="world">
  <rect class="hall" x="${hx}" y="${hy}" width="${wallX - hx}" height="${rowY(ROWS) + 64 - hy}" rx="16"/>
  <line class="wall" x1="${wallX}" y1="${hy}" x2="${wallX}" y2="${rowY(ROWS) + 64}"/>
  <rect class="theater" x="${hx}" y="${hy}" width="${colX(th.col + th.cols) - hx}" height="${rowY(th.row + th.rows) - 16 - hy}" rx="16"/>
  <text class="theater-label" x="${(hx + colX(th.col + th.cols))/2}" y="${(hy + rowY(th.row + th.rows) - 16)/2 + 6}">${th.label}</text>
  <line class="door" x1="${W/2-60}" y1="${rowY(ROWS) + 64}" x2="${W/2+60}" y2="${rowY(ROWS) + 64}"/>
  <text class="entrance" x="${W/2}" y="${rowY(ROWS) + 92}">Main entrance</text>`;

for (const b of booths) svgStr += `<g class="tbl" data-id="${b.id}">${boothShape(b)}${boothLabel(b)}</g>`;
svgStr += `<g id="pin" opacity="0"><circle class="ring" cx="0" cy="0" r="18"/>
  <path class="body" d="M0 0c-2-9-12-13-12-23a12 12 0 0 1 24 0c0 10-10 14-12 23z"/>
  <circle cx="0" cy="-23" r="4.5" fill="#fff"/></g></g></svg>`;
mapEl.innerHTML = svgStr;
const svg = document.getElementById("svg"), world = document.getElementById("world"), pin = document.getElementById("pin");
// Bring a booth to the front so its outline isn't covered by a neighbor's
const raise = el => world.insertBefore(el, pin);

// ---- Pan & zoom ----
const view = {x:0, y:0, k:1};
const MIN_K = 0.2, MAX_K = 4;
const clampK = k => Math.min(MAX_K, Math.max(MIN_K, k));
const apply = () => world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
let anim = null;

const wide = () => innerWidth >= 700;   // tablet and laptop layouts use a left side panel
function visibleArea() {
  if (wide()) {
    const left = document.body.classList.contains("panel-closed") ? 0 : innerWidth >= 1100 ? 400 : 372;
    return {top: 0, bottom: innerHeight, cx: (left + innerWidth)/2, cy: innerHeight/2, w: innerWidth - left, h: innerHeight};
  }
  const top = document.querySelector(".search").getBoundingClientRect().bottom + 8;
  const bottom = innerHeight - sheetH;
  return {top, bottom, cx: innerWidth/2, cy: (top + bottom)/2, w: innerWidth, h: Math.max(80, bottom - top)};
}
function animateTo(target) {
  cancelAnimationFrame(anim);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { Object.assign(view, target); apply(); return; }
  const from = {...view}, t0 = performance.now(), dur = 420;
  const step = now => {
    const p = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-p, 3);
    view.x = from.x + (target.x-from.x)*e; view.y = from.y + (target.y-from.y)*e; view.k = from.k + (target.k-from.k)*e;
    apply(); if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function fitHall(animate = true) {
  const a = visibleArea(), k = clampK(Math.min(a.w/W, a.h/H) * 0.98);
  const target = {k, x: a.cx - (W/2)*k, y: a.cy - (H/2)*k};
  animate ? animateTo(target) : (Object.assign(view, target), apply());
}
function flyTo(b) {
  const a = visibleArea(), k = clampK(Math.min(1.2, a.w / (4.6 * S)));
  animateTo({k, x: a.cx - b.cx*k, y: a.cy - b.cy*k});
}
function zoomAt(px, py, k) {
  k = clampK(k);
  const wx = (px - view.x)/view.k, wy = (py - view.y)/view.k;
  view.k = k; view.x = px - wx*k; view.y = py - wy*k; apply();
}

const pointers = new Map();
let pan = null, pinch = null, moved = false;
svg.addEventListener("pointerdown", e => {
  cancelAnimationFrame(anim);
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1) { moved = false; startPan(e.clientX, e.clientY); }
  if (pointers.size === 2) startPinch();
  mapEl.classList.add("dragging");
});
function startPan(x, y) { pan = {sx:x, sy:y, x:view.x, y:view.y}; pinch = null; }
function startPinch() {
  const [a, b] = [...pointers.values()];
  pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), mx:(a.x+b.x)/2, my:(a.y+b.y)/2, ...view};
  moved = true; pan = null;
}
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const k = clampK(pinch.k * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d);
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const wx = (pinch.mx - pinch.x)/pinch.k, wy = (pinch.my - pinch.y)/pinch.k;
    view.k = k; view.x = mx - wx*k; view.y = my - wy*k; apply();
  } else if (pan) {
    const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    view.x = pan.x + dx; view.y = pan.y + dy; apply();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 1) { const p = [...pointers.values()][0]; startPan(p.x, p.y); }
  if (pointers.size === 0) {
    mapEl.classList.remove("dragging");
    if (!moved && e.type === "pointerup") {
      const hit = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tbl");
      if (hit && hit.dataset.id === selected) { clearSelection(); setSheet(snaps()[0]); fitHall(); }
      else if (hit) select(hit.dataset.id);
    }
    pan = pinch = null;
  }
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("wheel", e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  zoomAt(e.clientX, e.clientY, view.k * Math.exp(-e.deltaY * 0.0015));
}, {passive:false});

const zoomBtn = f => { const a = visibleArea(); animateTo((() => {
  const k = clampK(view.k * f), wx = (a.cx - view.x)/view.k, wy = (a.cy - view.y)/view.k;
  return {k, x: a.cx - wx*k, y: a.cy - wy*k}; })()); };
document.getElementById("zin").onclick = () => zoomBtn(1.5);
document.getElementById("zout").onclick = () => zoomBtn(1/1.5);
document.getElementById("fit").onclick = () => fitHall();

// ---- Bottom sheet ----
const sheet = document.getElementById("sheet"), controls = document.getElementById("controls"), grab = document.getElementById("grab");
let sheetH = 0;
const snaps = () => [32, Math.round(innerHeight*0.45), Math.round(innerHeight*0.86)];
function setSheet(h, animate = true) {
  sheetH = h;
  sheet.classList.toggle("nodelay", !animate); controls.classList.toggle("nodelay", !animate);
  document.documentElement.style.setProperty("--sheet-h", h + "px");
}
let drag = null;
grab.addEventListener("pointerdown", e => { grab.setPointerCapture(e.pointerId); drag = {y:e.clientY, h:sheetH, moved:false}; });
grab.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = e.clientY - drag.y; if (Math.abs(dy) > 4) drag.moved = true;
  const s = snaps(); setSheet(Math.min(s[2], Math.max(s[0], drag.h - dy)), false);
});
grab.addEventListener("pointerup", () => {
  if (!drag) return;
  const s = snaps();
  if (!drag.moved) { const i = s.indexOf(drag.h); setSheet(s[(i + 1) % s.length]); }

  drag = null;
});
grab.addEventListener("keydown", e => {

    if (el) { el.classList.add("hover"); raise(el); }

// ---- Search ----
const q = document.getElementById("q"), suggest = document.getElementById("suggest"), clearBtn = document.getElementById("clear");

function search(text) {
  const s = text.trim().toLowerCase();
  clearBtn.hidden = !text;
  svg.querySelectorAll(".tbl.match").forEach(el => el.classList.remove("match"));
  if (!s) { svg.classList.remove("filtered"); closeSuggest(); return; }
  results = booths.filter(t => t.name.toLowerCase().includes(s) || t.booths.some(n => String(n).startsWith(s)));
  results.forEach(t => { const el = svg.querySelector(`.tbl[data-id="${t.id}"]`); el.classList.add("match"); raise(el); });
  svg.classList.add("filtered");
  active = 0;
  suggest.hidden = false;
  suggest.innerHTML = results.length
    ? results.slice(0, 6).map((t, i) => `<button data-id="${t.id}" class="${i === 0 ? "active" : ""}"><span class="badge">${t.label}</span>
        <span class="who"><strong>${t.name}</strong><span>${t.category}</span></span></button>`).join("")
    : `<div class="empty">No exhibitor matches “${esc(text.trim())}”. Try a company name or a booth number like 151.</div>`;
  suggest.querySelectorAll("button").forEach(b => b.onclick = () => select(b.dataset.id));
}
function closeSuggest() { suggest.hidden = true; }
q.addEventListener("input", () => search(q.value));
q.addEventListener("focus", () => { if (q.value) search(q.value); });
q.addEventListener("keydown", e => {
  const btns = [...suggest.querySelectorAll("button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!btns.length) return; e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : btns.length - 1)) % btns.length;
    btns.forEach((b, i) => b.classList.toggle("active", i === active));
  } else if (e.key === "Enter" && btns[active]) { select(btns[active].dataset.id); q.blur(); }
  else if (e.key === "Escape") closeSuggest();
});
clearBtn.onclick = () => { q.value = ""; search(""); q.focus(); };

// ---- Init ----
setSheet(snaps()[0], false);
setPanel(false);   // on tablets and laptops the list starts closed (phones use the bottom panel instead)
renderList();
fitHall(false);
let wasWide = wide();
addEventListener("resize", () => {
  const s = snaps(); setSheet(s.reduce((a, b) => Math.abs(b - sheetH) < Math.abs(a - sheetH) ? b : a), false);
  if (wide() !== wasWide) {   // switched between phone and tablet/laptop layouts: re-center the map
    wasWide = wide();
    selected ? flyTo(byId[selected]) : fitHall(false);
  }
});
</script>
